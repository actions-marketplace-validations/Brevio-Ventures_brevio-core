name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The exported suite runs on Windows as well as on Linux, and a failure there blocks (owner decision, 2026-11-13):
    # this repository is where Windows is proven, since its Actions minutes are free. Windows runs the oldest and
    # the newest Python the package supports.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.13'
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line ends as committed
        # Git for Windows checks files out with CRLF by default; this keeps them as committed, as in the export.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exported tests
        run: python -m unittest discover -s tests/pipeline/core_export -t . -v
      - name: Leak test
        run: python -m unittest tests.pipeline.core_export.test_core_leak -v
  readme:
    # Follows the README as written: its marked shell blocks run in an empty repository and in one with a planted
    # finding (scripts/readme_test.py). Windows reports without blocking until it has passed once (2026-11-05).
    name: readme (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install from this checkout
        run: |
          python -m pip install --quiet --require-hashes --only-binary :all: -r scripts/build-requirements.txt
          python -m pip install --quiet --no-build-isolation --no-deps .
      - name: Run the README
        run: python scripts/readme_test.py README.md
  manifest:
    # A pull request may change only the files a release exports (MANIFEST.json), plus the few paths
    # scripts/manifest_check.py allows (CONTRIBUTING.md, "How this repo works"). The check runs as it is at the base
    # commit, so a pull request cannot change it. A release pull request (a release-X.Y.Z branch of this repository,
    # not of a fork) replaces every file and is not checked.
    if: >-
      github.event_name == 'pull_request' &&
      !(startsWith(github.head_ref, 'release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Files outside the manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:scripts/manifest_check.py" > "$RUNNER_TEMP/manifest_check.py" \
            || cp scripts/manifest_check.py "$RUNNER_TEMP/manifest_check.py"
          python3 "$RUNNER_TEMP/manifest_check.py" --base "$BASE_SHA"
  gate:
    # The Action, run on this repository's own pull requests. A release pull request replaces every file and is not
    # checked by the scan: the export holds the rule documentation and tests that plant these patterns on purpose.
    if: >-
      github.event_name == 'pull_request' &&
      !(startsWith(github.head_ref, 'release-') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # the Action keeps one comment on the pull request up to date; read-only on forks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          source: '.'
