# From the agent-safe starter template: the workflow `brevio-core init` writes, pinned to brevio-core 0.10.0.
name: brevio-core
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  brevio-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: Brevio-Ventures/brevio-core@v0.10.0
        with:
          package-version: 0.10.0
          sarif: true
